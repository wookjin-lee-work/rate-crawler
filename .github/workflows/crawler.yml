name: Competition Rate Auto Crawler

on:
  schedule:
    # [시간대 보정] KST 03, 13, 23, 33, 43, 53분 = UTC 기준 매시 14, 24, 34, 44, 54, 04분
    # cron 표현식 (UTC 기준): 매시 04, 14, 24, 34, 44, 54분
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 3.10 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 크롤러 실행 (KST 타임존 적용)
      env:
        TZ: Asia/Seoul  # 실행 환경의 시간대를 한국(Asia/Seoul)으로 설정
      run: python rate_tracker.py

    - name: 변경된 CSV 파일 자동 커밋 및 푸시 (KST 시간 표기)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add competition_rate_log.csv
        
        # KST 기준으로 현재 날짜/시간 생성
        KST_TIME=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S')
        
        git commit -m "Auto update competition rate log [$KST_TIME KST]" || echo "No changes to commit"
        git push
